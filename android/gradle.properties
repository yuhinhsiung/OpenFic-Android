org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The Android Gradle Plugin refuses to build when the project path contains non-ASCII
# characters, because parts of the toolchain (aapt2, the NDK) used to mangle such paths on
# Windows. This repository's checkout path does contain them, and nothing inside the module
# does, so the check is disabled rather than forcing a move. Remove this line if the project
# never lives under a non-ASCII path.
android.overridePathCheck=true

kotlin.code.style=official
